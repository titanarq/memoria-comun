<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="El transcript nunca sale de la máquina; pasa por la lista blanca de alcance, el filtro determinista y la clasificación, y solo después cruza al exterior, donde el repo comprueba de nuevo antes de aceptar">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="1000" height="200" fill="#ffffff"/>
      <defs><marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box-dash" x="10" y="60" width="140" height="70" rx="4"/>
      <text class="t-strong" x="80" y="86" text-anchor="middle">Transcript</text>
      <text class="t-muted" x="80" y="106" text-anchor="middle">nunca sale</text>
      <text class="t-muted" x="80" y="122" text-anchor="middle">de la máquina</text>
      <path class="edge" d="M150,95 L200,95" marker-end="url(#arr4)"/>
      <rect class="box-accent" x="200" y="60" width="150" height="70" rx="4"/>
      <text class="t-strong" x="275" y="84" text-anchor="middle">1 · Alcance</text>
      <text class="t-muted" x="275" y="104" text-anchor="middle">lista blanca de proyectos</text>
      <text class="t-muted" x="275" y="120" text-anchor="middle">y rutas; lo demás no se lee</text>
      <path class="edge" d="M350,95 L400,95" marker-end="url(#arr4)"/>
      <rect class="box-accent" x="400" y="60" width="150" height="70" rx="4"/>
      <text class="t-strong" x="475" y="84" text-anchor="middle">2 · Filtro fijo</text>
      <text class="t-muted" x="475" y="104" text-anchor="middle">secretos, correos, DNI, IBAN,</text>
      <text class="t-muted" x="475" y="120" text-anchor="middle">términos de la lista</text>
      <path class="edge" d="M550,95 L600,95" marker-end="url(#arr4)"/>
      <rect class="box-accent" x="600" y="60" width="150" height="70" rx="4"/>
      <text class="t-strong" x="675" y="84" text-anchor="middle">3 · Clasificación</text>
      <text class="t-muted" x="675" y="104" text-anchor="middle">lo personal no sale;</text>
      <text class="t-muted" x="675" y="120" text-anchor="middle">lo funcional, generalizado</text>
      <path class="edge" d="M750,95 L850,95" marker-end="url(#arr4)"/>
      <line class="wall" x1="800" y1="20" x2="800" y2="82"/>
      <line class="wall" x1="800" y1="108" x2="800" y2="170"/>
      <rect class="box-human" x="850" y="60" width="140" height="70" rx="4"/>
      <text class="t-strong" x="920" y="84" text-anchor="middle">4 · Destino</text>
      <text class="t-muted" x="920" y="104" text-anchor="middle">el repo rechaza secretos</text>
      <text class="t-muted" x="920" y="120" text-anchor="middle">y términos; la PR la ve alguien</text>
      <text class="t-mono" x="800" y="190" text-anchor="middle">AQUÍ SALE DE LA MÁQUINA</text>
    </svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Una sesión de Claude Code, con persona y agentes que no guardan nada, instala plugins desde el repo, lee tareas y escribe relevos en Azure Boards, y envía por hook extractos filtrados y métricas a un almacén desde el que el consolidador abre PRs al repo">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="900" height="380" fill="#ffffff"/>
      <defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box" x="30" y="40" width="240" height="104" rx="4"/>
      <text class="t-strong" x="150" y="66" text-anchor="middle">Catálogos</text>
      <text x="150" y="86" text-anchor="middle">Conocimiento</text>
      <text class="t-muted" x="150" y="106" text-anchor="middle">plugins, fichas, reglas, skills, MCPs</text>
      <text class="t-muted" x="150" y="124" text-anchor="middle">versionado, revisado por PR</text>
      <rect class="box" x="630" y="40" width="240" height="104" rx="4"/>
      <text class="t-strong" x="750" y="66" text-anchor="middle">Tracker (fase 2)</text>
      <text x="750" y="86" text-anchor="middle">Estado</text>
      <text class="t-muted" x="750" y="106" text-anchor="middle">tareas, notas de relevo, preguntas</text>
      <text class="t-muted" x="750" y="124" text-anchor="middle">quién hizo qué, qué falta</text>
      <rect class="box-accent" x="330" y="150" width="240" height="84" rx="4"/>
      <text class="t-strong" x="450" y="178" text-anchor="middle">Sesión de Claude Code</text>
      <text x="450" y="198" text-anchor="middle">persona + agentes</text>
      <text class="t-muted" x="450" y="218" text-anchor="middle">no guardan nada</text>
      <rect class="box" x="330" y="290" width="240" height="76" rx="4"/>
      <text class="t-strong" x="450" y="316" text-anchor="middle">Almacén de extractos y métricas</text>
      <text class="t-muted" x="450" y="336" text-anchor="middle">nunca transcripts</text>
      <text class="t-muted" x="450" y="354" text-anchor="middle">coste por agente y modelo</text>
      <path class="edge" d="M200,144 L200,192 L330,192" marker-end="url(#arr2)"/>
      <text class="t-muted" x="262" y="186" text-anchor="middle">instala plugins</text>
      <path class="edge" d="M570,186 L750,186 L750,144" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
      <text class="t-muted" x="660" y="178" text-anchor="middle">lee tareas asignadas</text>
      <text class="t-muted" x="660" y="204" text-anchor="middle">escribe relevo y preguntas</text>
      <path class="edge" d="M450,234 L450,290" marker-end="url(#arr2)"/>
      <text class="t-muted" x="462" y="266">hook: extracto filtrado + métricas</text>
      <path class="edge" d="M330,328 L100,328 L100,144" marker-end="url(#arr2)"/>
      <text class="t-muted" x="215" y="320" text-anchor="middle">el consolidador abre PRs</text>
    </svg>

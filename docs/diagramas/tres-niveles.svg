<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-label="Tres niveles apilados: catálogo maestro, catálogo del departamento y los proyectos; hacia abajo baja lo obligatorio y lo genérico con versión fijada; hacia arriba sube, generalizado, lo que se repite">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="900" height="410" fill="#ffffff"/>
      <defs><marker id="arr10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box-accent" x="200" y="20" width="500" height="70" rx="4"/>
      <text class="t-strong" x="450" y="46" text-anchor="middle">Catálogo maestro</text>
      <text class="t-muted" x="450" y="66" text-anchor="middle">reglas de empresa, plugins base, skills genéricas, MCPs comunes</text>
      <path class="edge" d="M420,90 L420,150" marker-end="url(#arr10)"/>
      <text class="t-muted" x="410" y="124" text-anchor="end">hereda: lo obligatorio y lo genérico</text>
      <path class="edge-dash" d="M480,150 L480,90" marker-end="url(#arr10)"/>
      <text class="t-muted" x="490" y="124">sube, generalizado, lo que se repite</text>
      <rect class="box-accent" x="200" y="150" width="500" height="70" rx="4"/>
      <text class="t-strong" x="450" y="176" text-anchor="middle">Catálogo del departamento</text>
      <text class="t-muted" x="450" y="196" text-anchor="middle">convenciones, procesos, responsabilidades transversales</text>
      <path class="edge" d="M200,220 L200,290" marker-end="url(#arr10)"/>
      <text class="t-muted" x="192" y="258" text-anchor="end">hereda</text>
      <path class="edge-dash" d="M300,290 L300,220" marker-end="url(#arr10)"/>
      <text class="t-muted" x="308" y="258">sube lo repetido</text>
      <path class="edge" d="M600,220 L600,290" marker-end="url(#arr10)"/>
      <text class="t-muted" x="592" y="258" text-anchor="end">hereda</text>
      <path class="edge-dash" d="M700,290 L700,220" marker-end="url(#arr10)"/>
      <text class="t-muted" x="708" y="258">sube lo repetido</text>
      <rect class="box" x="120" y="290" width="260" height="90" rx="4"/>
      <text class="t-strong" x="250" y="314" text-anchor="middle">Proyecto A</text>
      <text class="t-muted" x="250" y="334" text-anchor="middle">reglas de su código, fichas de su producto</text>
      <text class="t-mono" x="250" y="354" text-anchor="middle">responsabilidades/&lt;x&gt;/config.yaml</text>
      <text class="t-muted" x="250" y="370" text-anchor="middle">versión fijada de los catálogos de arriba</text>
      <rect class="box" x="520" y="290" width="260" height="90" rx="4"/>
      <text class="t-strong" x="650" y="314" text-anchor="middle">Proyecto B</text>
      <text class="t-muted" x="650" y="334" text-anchor="middle">reglas de su código, fichas de su producto</text>
      <text class="t-mono" x="650" y="354" text-anchor="middle">responsabilidades/&lt;x&gt;/config.yaml</text>
      <text class="t-muted" x="650" y="370" text-anchor="middle">versión fijada de los catálogos de arriba</text>
      <text class="t-muted" x="450" y="402" text-anchor="middle">la misma forma en los tres: marketplace de plugins, fichas con identificador, árbol</text>
    </svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Un departamento contiene proyectos y responsabilidades; cada uno tiene un equipo con un responsable humano y sus agentes; una persona forma parte de varios equipos; el equipo genera tareas">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="760" height="300" fill="#ffffff"/>
      <defs><marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box" x="280" y="16" width="200" height="44" rx="4"/><text class="t-strong" x="380" y="43" text-anchor="middle">Departamento</text>
      <path class="edge" d="M340,60 L230,102" marker-end="url(#arr1)"/>
      <path class="edge" d="M420,60 L530,102" marker-end="url(#arr1)"/>
      <rect class="box" x="110" y="102" width="220" height="60" rx="4"/><text class="t-strong" x="220" y="126" text-anchor="middle">Proyectos</text><text class="t-muted" x="220" y="146" text-anchor="middle">producen</text>
      <rect class="box" x="430" y="102" width="220" height="60" rx="4"/><text class="t-strong" x="540" y="126" text-anchor="middle">Responsabilidades</text><text class="t-muted" x="540" y="146" text-anchor="middle">transversales, mantienen el control</text>
      <path class="edge" d="M220,162 L310,210" marker-end="url(#arr1)"/>
      <path class="edge" d="M540,162 L450,210" marker-end="url(#arr1)"/>
      <text class="t-muted" x="240" y="186" text-anchor="end">tiene un equipo</text>
      <text class="t-muted" x="520" y="186">tiene un equipo</text>
      <rect class="box" x="270" y="210" width="220" height="76" rx="4"/><text class="t-strong" x="380" y="234" text-anchor="middle">Equipo</text><text x="380" y="254" text-anchor="middle">responsable humano</text><text class="t-muted" x="380" y="272" text-anchor="middle">+ agentes, sus copilotos</text>
      <rect class="box-dash" x="20" y="222" width="150" height="56" rx="4"/><text class="t-strong" x="95" y="246" text-anchor="middle">Persona</text><text class="t-muted" x="95" y="266" text-anchor="middle">en varios equipos</text>
      <path class="edge-dash" d="M170,250 L270,250" marker-end="url(#arr1)"/><text class="t-muted" x="220" y="243" text-anchor="middle">forma parte</text>
      <rect class="box" x="570" y="222" width="170" height="56" rx="4"/><text class="t-strong" x="655" y="246" text-anchor="middle">Tareas</text><text class="t-muted" x="655" y="266" text-anchor="middle">recurrentes o no</text>
      <path class="edge" d="M490,250 L570,250" marker-end="url(#arr1)"/><text class="t-muted" x="530" y="243" text-anchor="middle">genera</text>
    </svg>

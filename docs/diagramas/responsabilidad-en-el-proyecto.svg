<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="El plugin de una responsabilidad, en el catálogo del departamento y escrito con huecos, baja al proyecto con versión fijada; la carpeta del proyecto guarda su configuración, sus reglas particulares y sus fichas; el agente en ejecución lee los dos y escribe fichas por PR en el proyecto; una particularidad repetida sube al plugin">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="900" height="300" fill="#ffffff"/>
      <defs><marker id="arr11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box-accent" x="40" y="30" width="340" height="110" rx="4"/>
      <text class="t-strong" x="210" y="54" text-anchor="middle">Plugin de calidad</text>
      <text class="t-muted" x="210" y="74" text-anchor="middle">en el catálogo del departamento</text>
      <text class="t-muted" x="210" y="92" text-anchor="middle">agentes, skills, plantillas de tarea</text>
      <text class="t-mono" x="210" y="112" text-anchor="middle">huecos: __TEST_COMMAND__, rutas, umbrales</text>
      <text class="t-muted" x="210" y="130" text-anchor="middle">mecanismo: el proyecto no lo edita</text>
      <path class="edge" d="M380,70 L520,70" marker-end="url(#arr11)"/>
      <text class="t-muted" x="450" y="62" text-anchor="middle">versión fijada</text>
      <path class="edge-dash" d="M520,110 L380,110" marker-end="url(#arr11)"/>
      <text class="t-muted" x="450" y="124" text-anchor="middle">lo repetido sube</text>
      <rect class="box" x="520" y="30" width="340" height="110" rx="4"/>
      <text class="t-strong" x="690" y="54" text-anchor="middle">Proyecto: responsabilidades/calidad/</text>
      <text class="t-muted" x="690" y="74" text-anchor="middle">config.yaml: los valores de este proyecto</text>
      <text class="t-muted" x="690" y="92" text-anchor="middle">reglas/: particularidades que solo aplican aquí</text>
      <text class="t-muted" x="690" y="110" text-anchor="middle">fichas/: lo aprendido sobre este proyecto</text>
      <text class="t-muted" x="690" y="128" text-anchor="middle">dueño: el responsable del proyecto</text>
      <path class="edge" d="M210,140 L210,235 L300,235" marker-end="url(#arr11)"/>
      <text class="t-muted" x="222" y="190">mecanismo</text>
      <path class="edge" d="M690,140 L690,235 L600,235" marker-start="url(#arr11)" marker-end="url(#arr11)"/>
      <text class="t-muted" x="702" y="184">baja la configuración</text>
      <text class="t-muted" x="702" y="200">suben las fichas, por PR</text>
      <rect class="box" x="300" y="200" width="300" height="70" rx="4"/>
      <text class="t-strong" x="450" y="224" text-anchor="middle">Agente de calidad en ejecución</text>
      <text class="t-muted" x="450" y="244" text-anchor="middle">lee el plugin y la carpeta del proyecto</text>
      <text class="t-muted" x="450" y="260" text-anchor="middle">corre aquí, vive allí</text>
    </svg>

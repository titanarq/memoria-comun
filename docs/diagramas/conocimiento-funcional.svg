<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="El backlog y las sesiones alimentan fichas de conocimiento con identificador estable, enunciado, orígenes y estado; la misma ficha se sirve como skill a Claude y como wiki a las personas; una contradicción vuelve al backlog como work item de pregunta">
<style>
svg{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a232c}
text{fill:currentColor;font-size:12px}
.t-strong{font-weight:600;font-size:13px}
.t-muted{fill:#5a6774;font-size:11px}
.t-mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;fill:#5a6774}
.t-inv{fill:#ffffff;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:500}
.box{fill:#ffffff;stroke:currentColor;stroke-width:1.2}
.box-accent{fill:#dbeeee;stroke:#0f6f74;stroke-width:1.5}
.box-human{fill:#f8e9d8;stroke:#b4651c;stroke-width:1.5}
.box-dash{fill:none;stroke:#5a6774;stroke-dasharray:5 4;stroke-width:1.1}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-dash{fill:none;stroke:#5a6774;stroke-width:1.2;stroke-dasharray:5 4}
.wall{fill:none;stroke:#5a6774;stroke-width:1.4;stroke-dasharray:3 4}
.venn{fill:#0f6f74;fill-opacity:.16;stroke:#0f6f74;stroke-width:1.4}
.node{fill:#0f6f74;stroke:none}
.bracket{fill:none;stroke:#5a6774;stroke-width:1.2}
</style>
<rect width="860" height="280" fill="#ffffff"/>
      <defs><marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
      <rect class="box" x="20" y="40" width="180" height="70" rx="4"/>
      <text class="t-strong" x="110" y="64" text-anchor="middle">Backlog</text>
      <text class="t-muted" x="110" y="84" text-anchor="middle">el diario</text>
      <text class="t-muted" x="110" y="100" text-anchor="middle">bugs y PBIs cerrados</text>
      <rect class="box" x="20" y="170" width="180" height="70" rx="4"/>
      <text class="t-strong" x="110" y="194" text-anchor="middle">Sesiones de Claude</text>
      <text class="t-muted" x="110" y="214" text-anchor="middle">extractos filtrados</text>
      <path class="edge" d="M200,75 L320,105" marker-end="url(#arr5)"/>
      <path class="edge" d="M200,205 L320,175" marker-end="url(#arr5)"/>
      <text class="t-muted" x="255" y="144" text-anchor="middle">extrae y cita</text>
      <rect class="box-accent" x="320" y="70" width="230" height="140" rx="4"/>
      <text class="t-strong" x="435" y="94" text-anchor="middle">Ficha de conocimiento</text>
      <text class="t-muted" x="435" y="116" text-anchor="middle">identificador estable</text>
      <text class="t-muted" x="435" y="134" text-anchor="middle">enunciado, casos, excepciones</text>
      <text class="t-muted" x="435" y="152" text-anchor="middle">orígenes: work items o fecha</text>
      <text class="t-muted" x="435" y="170" text-anchor="middle">estado: candidata, confirmada,</text>
      <text class="t-muted" x="435" y="186" text-anchor="middle">contradicha</text>
      <path class="edge" d="M550,110 L670,75" marker-end="url(#arr5)"/>
      <path class="edge" d="M550,170 L670,205" marker-end="url(#arr5)"/>
      <text class="t-muted" x="610" y="134" text-anchor="middle">misma fuente,</text>
      <text class="t-muted" x="610" y="150" text-anchor="middle">dos vistas</text>
      <rect class="box" x="670" y="40" width="170" height="70" rx="4"/>
      <text class="t-strong" x="755" y="64" text-anchor="middle">Skill del plugin</text>
      <text class="t-muted" x="755" y="84" text-anchor="middle">la carga Claude</text>
      <text class="t-muted" x="755" y="100" text-anchor="middle">cuando el tema aparece</text>
      <rect class="box" x="670" y="170" width="170" height="70" rx="4"/>
      <text class="t-strong" x="755" y="194" text-anchor="middle">Wiki publicada</text>
      <text class="t-muted" x="755" y="214" text-anchor="middle">la leen las personas,</text>
      <text class="t-muted" x="755" y="230" text-anchor="middle">publicada desde el repo</text>
      <path class="edge-dash" d="M435,70 L435,22 L110,22 L110,40" marker-end="url(#arr5)"/>
      <text class="t-muted" x="272" y="16" text-anchor="middle">una contradicción vuelve como work item de pregunta</text>
    </svg>
